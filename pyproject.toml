[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-housing-dss"
version = "0.1.0"
description = "A TOPSIS decision support system for student housing"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]
